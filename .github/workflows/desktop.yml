# Builds the Recast desktop app on each system's own runner: .dmg (macOS, Apple silicon and Intel), .exe (Windows
# installer), .rpm, .deb and AppImage (Linux). Without signing secrets the macOS app is ad-hoc signed (macOS asks the
# person to confirm the first launch) and the Windows installer is unsigned (SmartScreen asks once).
name: desktop
on:
  workflow_dispatch:
  push:
    paths: ["apps/desktop/**", "packages/**", "apps/calendar-link/**", ".github/workflows/desktop.yml"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: --mac, files: "apps/desktop/release/*.dmg\napps/desktop/release/*.zip" }
          - { os: windows-latest, target: --win, files: "apps/desktop/release/*.exe" }
          - { os: ubuntu-latest, target: --linux, files: "apps/desktop/release/*.rpm\napps/desktop/release/*.deb\napps/desktop/release/*.AppImage" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y rpm
      - run: pnpm install --frozen-lockfile
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - run: pnpm gen
      - run: pnpm --filter @recast/harness build
      - run: pnpm --filter @recast/desktop build
      - name: package
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          extra=""
          # No Apple certificate: sign ad hoc so the app still opens on Apple silicon (after the person confirms it).
          if [ "${{ runner.os }}" = "macOS" ] && [ -z "$CSC_LINK" ]; then extra="-c.mac.identity=-"; unset CSC_LINK CSC_KEY_PASSWORD; fi
          npx electron-builder ${{ matrix.target }} --publish never $extra
      # Open the packaged app the way a person would and check its window is on screen. Building is not launching:
      # a Mac app can package fine and still be stopped by macOS the moment it starts.
      - name: launch check (macOS, the app inside the .dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Every image passes the check Finder runs when it opens one ("the disk image is corrupted" otherwise).
          for d in apps/desktop/release/*.dmg; do hdiutil verify "$d"; done
          shasum -a 256 apps/desktop/release/*.dmg apps/desktop/release/*.zip
          dmg=$(ls apps/desktop/release/*-$( [ "$(uname -m)" = arm64 ] && echo arm64 || echo x64 ).dmg)
          hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/recast-dmg
          ditto /tmp/recast-dmg/Recast.app /tmp/Recast.app && hdiutil detach /tmp/recast-dmg
          codesign -dv --verbose=2 /tmp/Recast.app 2>&1 | grep -E "^(Executable|Signature|TeamIdentifier|CodeDirectory)" || true
          codesign --verify --deep --strict /tmp/Recast.app && echo "signature verifies"
          exe=/tmp/Recast.app/Contents/MacOS/$(defaults read /tmp/Recast.app/Contents/Info.plist CFBundleExecutable)
          set +e; perl -e 'alarm 90; exec @ARGV' "$exe" --recast-smoke > /tmp/smoke.log 2>&1; code=$?; set -e
          echo "exit code $code"; tail -40 /tmp/smoke.log
          grep -q 'RECAST_SMOKE {"visible":true.*"width":440,"height":640' /tmp/smoke.log
      - name: launch check (Linux, the packaged app)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y xvfb >/dev/null
          set +e; timeout 90 xvfb-run -a apps/desktop/release/linux-unpacked/recast --no-sandbox --recast-smoke > /tmp/smoke.log 2>&1; code=$?; set -e
          echo "exit code $code"; tail -40 /tmp/smoke.log
          grep -q 'RECAST_SMOKE {"visible":true.*"width":440,"height":640' /tmp/smoke.log
      - name: launch check (Windows, the packaged app)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls apps/desktop/release/*.exe
          export RECAST_SMOKE_OUT="$RUNNER_TEMP/smoke.log"
          set +e; timeout 90 apps/desktop/release/win-unpacked/recast.exe --recast-smoke; code=$?; set -e
          echo "exit code $code"; cat "$RECAST_SMOKE_OUT" || true
          grep -q 'RECAST_SMOKE {"visible":true.*"width":440,"height":640' "$RECAST_SMOKE_OUT"
      # The person's path, not a terminal shortcut: what macOS says about a browser-downloaded copy, then the install
      # command run on the downloaded disk image while an old copy of Recast is running (as on a Mac that tried earlier
      # builds), then opening it the way Finder and the Dock do (Launch Services), requiring its window on screen.
      - name: install check (macOS, the install command, opened like an app)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch=$( [ "$(uname -m)" = arm64 ] && echo arm64 || echo x64 )
          echo "--- Gatekeeper on a browser-downloaded copy (no Apple Developer ID yet):"
          spctl --status || true
          ditto /tmp/Recast.app /tmp/Downloaded.app && xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" /tmp/Downloaded.app
          spctl -a -vv -t exec /tmp/Downloaded.app 2>&1 || true
          echo "--- an old copy is running:"
          open -n /tmp/Recast.app; sleep 6; pgrep -lx recast
          echo "--- the install command, on the downloaded disk image:"
          mkdir -p "$HOME/Downloads" && cp apps/desktop/release/*-$arch.dmg "$HOME/Downloads/"
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$HOME"/Downloads/*-$arch.dmg
          RECAST_NO_OPEN=1 bash apps/desktop/scripts/install-mac.sh
          if pgrep -x recast >/dev/null; then echo "the old copy is still running"; exit 1; fi
          if xattr -l /Applications/Recast.app | grep -q quarantine; then echo "still marked as downloaded"; exit 1; fi
          echo "--- opened like an app:"
          out="$RUNNER_TEMP/open.log"; rm -f "$out"
          open --env RECAST_SMOKE_OUT="$out" /Applications/Recast.app --args --recast-smoke
          for _ in $(seq 1 60); do [ -s "$out" ] && break; sleep 1; done
          cat "$out"
          grep -q 'RECAST_SMOKE {"visible":true.*"width":440,"height":640' "$out"
      # One small download per kind of Mac, holding just its disk image (Safari unpacks GitHub's wrapper zip).
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with: { name: Recast-for-Mac-Apple-silicon, path: apps/desktop/release/*-arm64.dmg, if-no-files-found: error, compression-level: 0 }
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with: { name: Recast-for-Mac-Intel, path: apps/desktop/release/*-x64.dmg, if-no-files-found: error, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        with:
          name: recast-${{ runner.os }}
          compression-level: 0
          path: ${{ matrix.files }}
          if-no-files-found: error
