<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Calendar</title></head>
<body style="font: 16px system-ui; margin: 40px; max-width: 640px">
<h1>This weekend</h1>
<section id="cal" data-recast-dest="week" data-recast-kind="calendar" data-recast-label="Calendar" style="display: grid; gap: 12px">
  <div id="slot-fri" data-recast-slot="fri-1930" data-start="2026-10-23T19:30" style="border: 1px dashed #999; padding: 16px">Fri 23, 7:30 PM</div>
  <div id="slot-sat" data-recast-slot="sat-1930" data-start="2026-10-24T19:30" style="border: 1px dashed #999; padding: 16px">Sat 24, 7:30 PM</div>
  <ul id="events" data-recast-list></ul>
</section>
</body></html>
